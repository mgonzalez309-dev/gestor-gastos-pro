<aside class="sidebar glass-card" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-logo">
      <img src="/assets/logo.png" alt="Logo GastosApp" class="sidebar-logo-img" />
    </span>
    <span class="sidebar-brand">GastosApp</span>
    <button class="sidebar-close" id="sidebar-close" aria-label="Cerrar menu"><i data-lucide="x"></i></button>
  </div>

  <nav class="sidebar-nav" role="navigation" aria-label="Menu principal">
    <a href="/dashboard" class="nav-link" data-page="dashboard" aria-current="page">
      <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span><span>Dashboard</span>
    </a>
    <a href="/expenses" class="nav-link" data-page="expenses">
      <span class="nav-icon"><i data-lucide="credit-card"></i></span><span>Mis gastos</span>
    </a>
    <a href="/upload-ticket" class="nav-link" data-page="tickets">
      <span class="nav-icon"><i data-lucide="receipt"></i></span><span>Subir ticket</span>
    </a>
    <a href="/advisor" class="nav-link advisor-only hidden" data-page="advisor">
      <span class="nav-icon"><i data-lucide="users"></i></span><span>Panel asesor</span>
    </a>
    <a href="/profile" class="nav-link" data-page="profile">
      <span class="nav-icon"><i data-lucide="user"></i></span><span>Mi perfil</span>
    </a>
  </nav>

  <!-- Campana de notificaciones -->
  <div class="notif-bell-wrap" id="notif-bell-wrap">
    <button class="notif-bell-btn" id="notif-bell-btn" aria-label="Notificaciones" type="button">
      <i data-lucide="bell"></i>
      <span class="notif-badge hidden" id="notif-badge">0</span>
    </button>
    <!-- Dropdown panel -->
    <div class="notif-panel hidden" id="notif-panel">
      <div class="notif-panel-header">
        <span class="notif-panel-title">Notificaciones</span>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-ghost btn-sm" id="notif-mark-all-btn" type="button">Leer todo</button>
          <button class="btn btn-ghost btn-sm" id="notif-clear-all-btn" type="button" style="color:var(--color-danger,#e53e3e)">Limpiar</button>
        </div>
      </div>
      <div class="notif-list" id="notif-list">
        <div class="notif-empty">Sin notificaciones</div>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="user-info" id="sidebar-user" title="Mi perfil" style="cursor:pointer">
      <div class="user-avatar" id="user-avatar-initials">JD</div>
      <div class="user-name" id="sidebar-user-name">Cargando...</div>
    </div>
    <button class="btn btn-ghost btn-sm" id="logout-btn">Salir</button>
  </div>
</aside>
